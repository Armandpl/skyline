[project]
name = "trajectory-optimization"
version = "0.1.0"
description = ""
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.3",
    "gymnasium>=0.29,<1.0",
    "scipy>=1.10.1",
    "pyyaml>=6.0",
    "ezdxf>=1.0.3",
    "matplotlib>=3.7.1",
    "shapely>=2.0.1",
    "pygame>=2.4.0",
    "simple-pid>=2.0.0",
    "stable-baselines3==2.8.0",
    "tqdm>=4.65.0",
    "rich>=13.3.5",
    "wandb>=0.15.2",
    "tensorboard>=2.13.0",
    "moviepy>=1.0.3,<2.0",
    "hydra-core>=1.3.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.22.0",
    "pre-commit>=3.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trajectory_optimization"]
